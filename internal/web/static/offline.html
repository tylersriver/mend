<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<meta name="theme-color" content="#f5f5f7"/>
	<title>Offline · mend</title>
	<!-- Styles are inlined: this page must render with no network. -->
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			background: #f5f5f7; color: #1e293b; padding: 1.5rem;
		}
		.card { max-width: 28rem; text-align: center; }
		.mark {
			width: 56px; height: 56px; border-radius: 14px; background: #0d9488; color: #fff;
			display: inline-flex; align-items: center; justify-content: center;
			font-size: 2rem; font-weight: 700; line-height: 1; margin-bottom: 1rem;
		}
		h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
		p { color: #64748b; font-size: .95rem; line-height: 1.5; margin: 0 0 1.25rem; }
		button {
			background: #0d9488; color: #fff; border: 0; border-radius: 8px;
			padding: .6rem 1.1rem; font-size: .95rem; cursor: pointer;
		}
		button:hover { background: #115e59; }
	</style>
</head>
<body>
	<div class="card">
		<div class="mark">+</div>
		<h1>You're offline</h1>
		<p>
			mend keeps your medical data on the server and never caches it on the
			device — stale health information is worse than none. Reconnect to pick up
			right where you left off.
		</p>
		<button onclick="location.reload()">Try again</button>
	</div>
</body>
</html>
